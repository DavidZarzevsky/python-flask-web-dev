<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact us</title>
    <link rel="stylesheet" href="CSS/contactUs.css">
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="logout-button">Log out</a>
    <a href="mainMenu.html" class="mainMenu-button">Menu</a>
</div>

<div id="image-logo">
    <img src="pics/X-BudgetSymbol.png" alt="Welcome Image">
</div>

<div class="content">
    <div class="body">

        <p class="Contact"> Contact us</p>
        <h1> Get in touch today!</h1>
        <br>
        <br>
        <p class="userInfo"> Please enter the following information:</p>
        <input type="text" id="Name" name="userName" placeholder="Your name">
        <br>
        <br>
        <input type="text" id="Email" name="userEmail" placeholder="Your email">
        <br>
        <br>
        <input type="text" id="Phone" name="userPhone" placeholder="Your phone number">
        <br>
        <br>
        <input type="text" id="message" name="userMessage" placeholder="Your message">

        <button class="message">Send message</button>
    </div>

    <div class="Information">
        <div id="image-worker">
            <img src="pics/Workers.png" alt="Worker img">
        </div>

    </div>
</div>
</body>
</html>
