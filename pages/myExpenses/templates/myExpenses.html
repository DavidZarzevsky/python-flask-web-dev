<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <script src="../static/javaScript/myExpenses.js"></script>
    <script src="../../../static/JavaScript/staticDB.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../../../static/css/GlobalStyleSheet.css">
    <link rel="stylesheet" href="../static/css/myExpenses.css">
</head>

<body>

<div class="top-bar">
    <div class="image-logo">
        <img src="../../../static/pics/X-BudgetSymbol.png" alt="Welcome Image">
    </div>
    <div class="bar-left-side">
        <a href="../../index/templates/index.html" class="logout-button">Log out</a>
        <a href="../../mainMenu/templates/mainMenu.html" class="mainMenu-button">Menu</a>
    </div>
</div>

<div class="content">

    <div class="expenses-overview">
        <h1>Expenses Overview</h1>
        <br>
        <div class="pie-chart">
            <canvas id="myChart" width="400" height="400"></canvas>
        </div>
    </div>

    <div class="expenses-breakdown">

        <div class="total-expenses">
            <h1>Total Expenses:</h1>
            <span id="totalExpenses">0</span>
        </div>
        <br>
        <div class="expense-dropdown">
            <label>Select Expense Type:</label>
            <select id="expenseTypeDropdown" onchange="updateExpensesByType()">
                // Add default option as fade out text and disable it
                <option value="" disabled selected>Select Type</option>
                <option value="Housing">Housing</option>
                <option value="Food">Food</option>
                <option value="Transportation">Transportation</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Others">Others</option>
            </select>
        </div>
        <br>
        <div class="expenses-by-type">
            <h2>Expenses by Type</h2>
            <div id="expensesByType"></div>
        </div>
    </div>
</div>
</body>

</html>
