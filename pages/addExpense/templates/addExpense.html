{% extends 'base.html' %}
 {% block title %} Add Expense {% endblock %}
{% block css %}
<link rel="stylesheet" href="{{ url_for('addExpense.static', filename= 'css/addExpense.css') }}"/>
{% endblock %}
    {% block main %}
    <div class="expense-form">
        <form id="add-expense-form" action="{{ url_for('addExpense.addExpenseFunc') }}" method="POST">
            <h1>Add Expense &#128178;</h1>
            <label for="expense-category">Select Category:</label>
            <select id="expense-category" name="expense-category">
                <option value="" disabled selected>Choose expense</option>
                <option value="food">Food</option>
                <option value="transportation">Transportation</option>
                <option value="utilities">Utilities</option>
                <option value="entertainment">Entertainment</option>
                <option value="clothing">Clothing</option>
                <option value="health">Health</option>
                <option value="insurance">Insurance</option>
                <option value="education">Education</option>
                <option value="gifts">Gifts</option>
                <option value="other">Other</option>
            </select>
            <label for="expense-amount">Enter Amount:</label>
            <input type="number" id="expense-amount" name="expense-amount" required>

            <input type="submit" value="Submit">
        </form>
    </div>
{% endblock %}
{% block page_body_js %}
    <script src="{{ url_for('addExpense.static', filename= 'js/addExpenseValidation.js') }}"></script>
{% endblock %}
