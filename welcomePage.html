<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="welcomePage.css">
</head>
<body>

<div class="login-container">
    <h2>Welcome Back &#x1F44B;</h2>
    <p class="sub-heading">We are happy to see you again</p>
    <form class="login-form" action="#" method="post">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <button type="submit">Login</button>
        </div>
    </form>
    <p class="sub-heading">Don't have an account? <a href=SignUp.html">Sign up</a></p>
</div>

<div id="image-welcome">
    <img src="pics/X-BudgetSymbol.png" alt="Welcome Image">
</div>

</body>
</html>
